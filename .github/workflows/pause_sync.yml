name: Pause Sync
# Code lives in this PUBLIC repo; all lead data (leads_archive/) lives in
# the PRIVATE repo amanbhargava-Squadstack/Swiggy-lead-sync and is only
# ever committed there. Logs from these runs are public, so the scripts
# never log names or phone numbers.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "How long should this pause last?"
        required: true
        type: choice
        options:
          - "today only (auto-resumes tomorrow)"
          - "indefinite (stays off until you resume)"
        default: "today only (auto-resumes tomorrow)"
      reason:
        description: "Optional: why are you pausing? (shown in the Slack alert)"
        required: false
        default: ""
  repository_dispatch:
    types: [pause_sync]

permissions:
  contents: read

concurrency:
  group: lead-sync-data
  cancel-in-progress: false

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this (public) code repo
        uses: actions/checkout@v4

      - name: Check out the PRIVATE data repo (leads archive)
        uses: actions/checkout@v4
        with:
          repository: amanbhargava-Squadstack/Swiggy-lead-sync
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data

      - name: Point leads_archive/ at the private repo
        run: |
          mkdir -p private-data/leads_archive
          ln -s private-data/leads_archive leads_archive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Set status to paused
        env:
          ACTION: pause
          SCOPE: ${{ (github.event.inputs.scope == 'today only (auto-resumes tomorrow)' && 'today') || (github.event.inputs.scope == 'indefinite (stays off until you resume)' && 'indefinite') || github.event.client_payload.scope || 'indefinite' }}
          REASON: ${{ github.event.inputs.reason || github.event.client_payload.reason || '' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python set_pipeline_status.py

      - name: Save the archive to the PRIVATE data repo
        if: always()
        working-directory: private-data
        run: |
          git config user.name "swiggy-lead-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leads_archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -q -m "Pause sync"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull -q --rebase origin "$BRANCH"
            git push -q origin "$BRANCH"
            echo "Archive saved to private repo."
          fi
